{% extends 'app_matriculas/inicio.html' %}

{% block titulo %}Crear Matrícula{% endblock %}

{% block contenido %}
<style>
    .titulo-estilo {
        background-color: rgb(22, 87, 117); /* Azul pastel para el título */
        color: #FFFFFF; /* Texto blanco para contraste */
        padding: 15px; /* Espaciado interno */
        border-radius: 8px; /* Bordes redondeados */
        text-align: center; /* Centrar texto */
        font-size: 2em; /* Tamaño de fuente más grande */
        margin-bottom: 20px; /* Espaciado inferior */
    }

    .form-container {
        background-color: #E0F7FA; /* Azul pastel suave para fondo de formulario */
        padding: 20px; /* Espaciado interior del formulario */
        border-radius: 8px; /* Bordes redondeados del formulario */
    }

    .btn-container {
        display: flex;
        justify-content: space-between; /* Espacio entre los botones */
        margin-top: 20px; /* Margen superior para separación */
    }
</style>

<h1 class="titulo-estilo">{% if matricula %}Editar Matrícula{% else %}Crear Matrícula{% endif %}</h1>

<div class="form-container">
    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_aniolectivo" class="form-label">Año Lectivo:</label>
            <select name="aniolectivo" id="id_aniolectivo" class="form-select" required>
                <option value="">Seleccione un año lectivo</option>
                {% for item in anios_lectivos %}
                    <option value="{{ item.id }}" {% if matricula and matricula.aniolectivo.id == item.id %}selected{% endif %}>
                        {{ item.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="id_paralelo" class="form-label">Paralelo:</label>
            <select name="paralelo" id="id_paralelo" class="form-select" required>
                <option value="">Seleccione un paralelo</option>
                {% for paralelo in paralelos %}
                    <option value="{{ paralelo.id }}" {% if matricula and matricula.paralelo.id == paralelo.id %}selected{% endif %}>
                        {{ paralelo.nombre }} - {{ paralelo.grado.nombre }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label for="id_estudiante" class="form-label">Estudiante:</label>
            <select name="estudiante" id="id_estudiante" class="form-select" required>
                <option value="">Seleccione un estudiante</option>
                {% for estudiante in estudiantes %}
                    <option value="{{ estudiante.id }}" {% if matricula and matricula.estudiante.id == estudiante.id %}selected{% endif %}>
                        {{ estudiante.nombres }} {{ estudiante.apellidos }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'app_matriculas:matriculados_lista' %}" class="btn btn-secondary">Regresar</a>
        </div>
    </form>
</div>
{% endblock %}
