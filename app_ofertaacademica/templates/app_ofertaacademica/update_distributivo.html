<!-- templates/distributivo/update_distributivo.html -->  
{% extends 'inicio.html' %}  

{% block title %}Actualizar Distributivo{% endblock %}  

{% block contenido %}  
<h2>Actualizar Distributivo</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Actualizar</button> 
    <a href="{% url 'app_ofertaacademica:admin_distributivo' %}" class="btn btn-secondary">Volver</a> 
</form>    
{% endblock %}
