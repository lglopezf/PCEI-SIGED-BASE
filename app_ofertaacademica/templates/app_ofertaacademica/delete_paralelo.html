<!-- templates/paralelo/delete_paralelo.html -->  
{% extends 'inicio.html' %}  

{% block title %}Eliminar Paralelo{% endblock %}  

{% block contenido %} 
    <h1>Eliminar Paralelo</h1>
    <p>¿Estás seguro de que deseas eliminar el paralelo "{{ paralelo.nombre }}{{ paralelo.grado }}{{ paralelo.aniolectivo }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar</button>
    </form>
    <a href="{% url 'app_ofertaacademica:admin_paralelo' %}">Cancelar</a>
    {% endblock %}
