<!-- templates/distributivo/delete_distributivo.html -->  
{% extends 'inicio.html' %}  

{% block title %}Eliminar Distributivo{% endblock %}  

{% block contenido %}  
<h2>Eliminar Distributivo</h2>  
<p>¿Estás seguro de que deseas eliminar a {{ distributivo }}?</p>  
<form method="POST">  
    {% csrf_token %}  
    <button type="submit" class="btn btn-danger">Eliminar</button>  
</form>  
<a href="{% url 'app_ofertaacademica:admin_distributivo' %}" class="btn btn-secondary">Cancelar</a>  
{% endblock %}
