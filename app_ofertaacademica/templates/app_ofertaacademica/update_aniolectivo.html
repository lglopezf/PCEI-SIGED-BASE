<!-- templates/aniolectivo/update_aniolectivo.html -->  
{% extends 'inicio.html' %}  

{% block title %}Actualizar Año Lectivo{% endblock %}  

{% block contenido %}  
<h2>Actualizar Año Lectivo</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Actualizar</button> 
    <a href="{% url 'app_ofertaacademica:admin_aniolectivo' %}" class="btn btn-secondary">Volver</a>   
</form> 
{% endblock %}
