<!-- templates/distributivo/create_distributivo.html -->  
{% extends 'inicio.html' %}  

{% block title %}Crear Distributivo{% endblock %}  

{% block contenido %}  
<h2>Crear Distributivo</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Guardar</button>  
    <a href="{% url 'app_ofertaacademica:admin_distributivo' %}" class="btn btn-secondary">Volver</a>  
</form>  
{% endblock %}
