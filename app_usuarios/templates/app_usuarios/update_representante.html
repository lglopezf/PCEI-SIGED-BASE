<!-- templates/representantes/update_representante.html -->  
{% extends 'inicio.html' %}  

{% block title %}Actualizar Representante{% endblock %}  

{% block contenido %}  
<h2>Actualizar Representante</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Actualizar</button> 
    <a href="{% url 'app_usuarios:admin_representantes' %}" class="btn btn-secondary">Volver</a> 
</form>    
{% endblock %}
