<!-- templates/estudiantes/update_estudiante.html -->  
{% extends 'inicio.html' %}  

{% block title %}Actualizar Estudiante{% endblock %}  

{% block contenido %}  
<h2>Actualizar Estudiante</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Actualizar</button>  
    <a href="{% url 'app_usuarios:admin_estudiantes' %}" class="btn btn-secondary">Volver</a>  
</form>  
{% endblock %}
