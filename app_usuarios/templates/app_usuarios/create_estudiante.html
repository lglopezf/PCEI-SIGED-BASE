<!-- templates/docentes/create_docente.html -->  
{% extends 'inicio.html' %}  

{% block title %}Crear Estudiante{% endblock %}  

{% block contenido %}  
<h2>Crear Estudiante</h2>  
<form method="POST">  
    {% csrf_token %}  
    {{ form.as_p }}  
    <button type="submit" class="btn btn-primary">Guardar</button>  
    <a href="{% url 'app_usuarios:admin_estudiantes' %}" class="btn btn-secondary">Volver</a>
</form>    
{% endblock %}
