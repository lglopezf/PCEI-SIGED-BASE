{% extends 'inicio.html' %}

{% block title %}Libro de calificaciones{% endblock %}

{% block contenido %}
<div class="row">
    <div class="col-8 mb-2">
        <div class="card border border-primary-subtle">
            <div class="card-header bg-primary-subtle">
                PeriodoS academicos
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Eliminar</button>
                    <a href="{% url 'app_librocalificaciones:LISTAR_PERIODO' %}" class="btn btn-secondary">Cancelar</a>
                </form>
            </div>
        </div>
   
    </div>
</div>
    
{%endblock%}
